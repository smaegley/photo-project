services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api          # the Dockerfile's last stage is `ingest`; pin the site image
    container_name: photo-api
    environment:
      - DB_PATH=/data/photos.db
      - LIBRARY_ROOT=/mnt/photos/library
      # Cloudflare Access (SPEC §6.3). When BOTH are set, JWT verification is
      # enforced and the dev bypass is off. Leave unset only for local testing.
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD}
      # Backblaze B2, read-only (SPEC §13). From .env; blank = local-only serving.
      # (Was carried by an untracked override file on prod until 2026-11-13.)
      - B2_KEY_ID=${B2_KEY_ID:-}
      - B2_APP_KEY=${B2_APP_KEY:-}
      - B2_BUCKET=${B2_BUCKET:-}
      - B2_ENDPOINT=${B2_ENDPOINT:-}
    volumes:
      - ./data:/data
      # Image library, read-WRITE: the app rotates slides in place and (re)generates
      # thumbnails under library/thumbnails. Archival masters live on the Mac, so the
      # library here is the working copy. LIBRARY_ROOT_HOST is wherever the photo
      # drive is mounted on the LXC (see infra/DEPLOY.md).
      - ${LIBRARY_ROOT_HOST:-/mnt/photos/library}:/mnt/photos/library
    restart: unless-stopped
    networks:
      - internal

  # One-shot ML jobs (SPEC §15.12): face detection now, nightly ingest later. Behind a
  # profile so `docker compose up -d` never starts or builds it; run explicitly:
  #   docker compose --profile ingest build ingest
  #   docker compose --profile ingest run --rm ingest app.detect_faces
  # Limits: mem_limit == memswap_limit so it OOMs cleanly instead of thrashing the swap
  # it shares with the website; 2 CPUs at low priority so `api` always has headroom.
  ingest:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: Dockerfile
      target: ingest
    environment:
      - DB_PATH=/data/photos.db
      - LIBRARY_ROOT=/mnt/photos/library
      - B2_KEY_ID=${B2_KEY_ID:-}
      - B2_APP_KEY=${B2_APP_KEY:-}
      - B2_BUCKET=${B2_BUCKET:-}
      - B2_ENDPOINT=${B2_ENDPOINT:-}
      # report = list what reconcile would re-point / cull / refresh; apply = do it (SPEC §15.15 slice 4)
      - INGEST_RECONCILE=${INGEST_RECONCILE:-report}
    volumes:
      - ./data:/data
      - ${LIBRARY_ROOT_HOST:-/mnt/photos/library}:/mnt/photos/library
      # Model weights, installed once on the host (infra/DEPLOY.md), read-only.
      - ${MODELS_HOST:-./models}:/root/.insightface/models:ro
    mem_limit: 2600m
    memswap_limit: 2600m
    cpus: 2
    cpu_shares: 256

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: photo-caddy
    # Plain HTTP, bound to localhost only — cloudflared (host systemd) tunnels to
    # this. Nothing is exposed to the LAN or internet directly.
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - internal

networks:
  internal:
